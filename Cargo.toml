[package]
name = "mpe-plugin-openapi"
version = "0.1.0"
edition = "2021"
description = "Swagger / OpenAPI datasource plugin for Multi-Protocol Flow Executor (MPE)"
license = "MIT"
repository = "https://github.com/multi-protocol-flow/mpe-plugin-openapi"

[dependencies]
mpe-plugin-sdk = { git = "https://github.com/multi-protocol-flow/mpe-plugin-sdk.git", tag = "v0.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2"
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "openapi"
path = "src/main.rs"
